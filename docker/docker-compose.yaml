services:
  db:
    image: postgres:15-alpine
    container_name: alango-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-alango}
    ports:
      - "${DB_PORT:-5436}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alango-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: alango-mailpit
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_PORT:-8025}:8025"

  app:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: alango-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DB_HOST: db
      REDIS_ADDR: redis:6379
    ports:
      - "${SERVER_PORT:-8092}:${SERVER_PORT:-8092}"
    volumes:
      - ../uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../ui
      dockerfile: ../docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8092/api}
    container_name: alango-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3002}:3000"
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
