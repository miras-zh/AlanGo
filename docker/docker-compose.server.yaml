name: alango

services:
  db:
    image: postgres:15-alpine
    container_name: alango-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-alango}
    volumes:
      - alango_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - alango_internal

  redis:
    image: redis:7-alpine
    container_name: alango-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server
        fi
    volumes:
      - alango_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - alango_internal

  app:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: alango-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-alango}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SERVER_PORT: 8092
      UPLOAD_DIR: /app/uploads
      UPLOAD_PUBLIC_URL: ${UPLOAD_PUBLIC_URL:-https://alango.78.140.223.90.sslip.io/uploads}
    ports:
      - "127.0.0.1:8092:8092"
    volumes:
      - ../uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alango_internal
      - vison_network

  db-backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: alango-db-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME:-alango}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
      HEALTHCHECK_PORT: 8080
    volumes:
      - ${ALANGO_BACKUP_DIR:-/root/backups/alango}:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - alango_internal

volumes:
  alango_pgdata:
  alango_redisdata:

networks:
  alango_internal:
  vison_network:
    name: docker_default
    external: true
