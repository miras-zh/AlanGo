<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>{{.Title}}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            color: #1f1f1f;
        }
        .wrapper {
            width: 100%;
            padding: 32px 16px;
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }
        .header {
            padding: 32px 40px 20px;
            font-size: 26px;
            font-weight: 700;
        }
        .content {
            padding: 10px 40px 40px;
        }
        .title {
            margin: 0 0 24px;
            font-size: 28px;
            line-height: 1.25;
        }
        .text {
            margin: 0 0 20px;
            font-size: 16px;
            line-height: 1.6;
            color: #444444;
        }
        .highlight {
            margin: 24px 0;
            padding: 20px;
            background-color: #f4f7fb;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
        }
        .button {
            display: inline-block;
            margin-top: 8px;
            padding: 14px 24px;
            background-color: #6D4BFF;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
        }
        .footer {
            padding: 24px 40px 32px;
            border-top: 1px solid #eeeeee;
            font-size: 13px;
            line-height: 1.6;
            color: #888888;
        }
        .footer a {
            color: #666666;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
                color: #ffffff;
            }
            .container {
                background-color: #1e1e1e;
            }
            .text {
                color: #d0d0d0;
            }
            .highlight {
                background-color: #292929;
                color: #ffffff;
            }
            .footer {
                border-color: #333333;
                color: #999999;
            }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="container">
        <div class="header">{{.Brand}}</div>
        <div class="content">
            <h1 class="title">{{.Title}}</h1>
            {{if .Name}}
            <p class="text">Здравствуйте, {{.Name}}!</p>
            {{end}}
            <p class="text">{{.Message}}</p>
            {{if .Highlight}}
            <div class="highlight">{{.Highlight}}</div>
            {{end}}
            {{if .ButtonURL}}
            <a href="{{.ButtonURL}}" class="button" target="_blank">{{.ButtonText}}</a>
            {{end}}
        </div>
        <div class="footer">
            © {{.Year}} {{.Brand}}
            <br>
            <a href="{{.SiteURL}}">{{.SiteURL}}</a>
            <br><br>
            Это автоматическое сообщение. Пожалуйста, не отвечайте на него.
        </div>
    </div>
</div>
</body>
</html>
