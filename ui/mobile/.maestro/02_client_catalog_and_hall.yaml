appId: kz.alango.app
---
- runFlow: subflows/ensure_guest.yaml
- runFlow:
    file: subflows/login_from_guest.yaml
    env:
      EMAIL: "client1@alan.kz"
      PASSWORD: "1234567890Ww+"
- extendedWaitUntil:
    visible: "Профиль"
    timeout: 15000
- tapOn: "Профиль"
- extendedWaitUntil:
    visible:
      id: "profile-my-bookings-btn"
    timeout: 10000
- tapOn:
    id: "profile-my-bookings-btn"
- extendedWaitUntil:
    visible: ".*Alan Test Hall.*"
    timeout: 10000
- tapOn:
    id: "my-bookings-tab-history"
- tapOn:
    id: "my-bookings-tab-upcoming"
- tapOn:
    id: "my-bookings-back-btn"
- tapOn: "Залы"
- extendedWaitUntil:
    visible:
      id: "catalog-tab-halls"
    timeout: 10000
- assertVisible:
    id: "catalog-tab-arenas"
- tapOn:
    id: "catalog-search-input"
- inputText: "Alan Test Hall"
- pressKey: Enter
- extendedWaitUntil:
    visible: ".*Спортивный ПВХ-линолеум.*"
    timeout: 10000
- tapOn: ".*Спортивный ПВХ-линолеум.*"
- extendedWaitUntil:
    visible:
      id: "hall-tab-about"
    timeout: 10000
- tapOn:
    id: "hall-tab-schedule"
- tapOn:
    id: "hall-tab-reviews"
- assertVisible: ".*Пока нет отзывов.*"
- tapOn:
    id: "hall-tab-about"
- tapOn:
    id: "hall-back-btn"
