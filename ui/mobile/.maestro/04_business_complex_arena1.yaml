appId: kz.alango.app
---
- runFlow: subflows/ensure_guest.yaml
- runFlow:
    file: subflows/login_from_guest.yaml
    env:
      EMAIL: "arena1@alan.kz"
      PASSWORD: "1234567890Ww+"
- extendedWaitUntil:
    visible: ".*Alan Arena Test Complex.*"
    timeout: 15000
- tapOn:
    id: "biz-tab-halls"
- extendedWaitUntil:
    visible: ".*Залы комплекса.*"
    timeout: 10000
- assertVisible: ".*Alan Football Test.*"
- tapOn:
    id: "biz-tab-bookings"
- assertVisible:
    id: "biz-bookings-mode-requests"
- tapOn:
    id: "biz-tab-profile"
- scrollUntilVisible:
    element:
      id: "biz-as-client-btn"
    direction: DOWN
- assertVisible:
    id: "biz-as-client-btn"
- scrollUntilVisible:
    element:
      id: "biz-logout-btn"
    direction: DOWN
- tapOn:
    id: "biz-logout-btn"
- tapOn: "Выйти"
