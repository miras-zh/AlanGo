appId: kz.alango.app
---
- runFlow:
    when:
      visible:
        id: "profile-guest-login-btn"
    commands:
      - tapOn:
          id: "profile-guest-login-btn"
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 10000
- tapOn:
    id: "login-email-input"
- inputText: "${EMAIL}"
- tapOn:
    id: "login-password-input"
- inputText: "${PASSWORD}"
- tapOn:
    text: "Вход в Alan Go"
- tapOn:
    id: "login-submit-btn"
- extendedWaitUntil:
    notVisible:
      id: "login-submit-btn"
    timeout: 15000
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Не сейчас"
    commands:
      - tapOn: "Не сейчас"
      - waitForAnimationToEnd
