appId: kz.alango.app
---
- runFlow: subflows/ensure_guest.yaml
- tapOn:
    id: "profile-guest-login-btn"
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-forgot-link"
- assertVisible:
    id: "forgot-email-input"
- tapOn:
    id: "forgot-close-btn"
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-register-link"
- assertVisible:
    id: "register-name-input"
- assertVisible:
    id: "register-password-input"
- tapOn:
    id: "register-switch-login-btn"
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-back-btn"
- runFlow:
    file: subflows/login_from_guest.yaml
    env:
      EMAIL: "client1@alan.kz"
      PASSWORD: "1234567890Ww+"
- extendedWaitUntil:
    visible: "Профиль"
    timeout: 15000
- tapOn: "Профиль"
- extendedWaitUntil:
    visible: "Клиент AlanGo Тест"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "pref-theme-light"
    direction: DOWN
- tapOn:
    id: "pref-theme-light"
- tapOn:
    id: "pref-theme-dark"
- scrollUntilVisible:
    element:
      id: "prefs-account-row"
    direction: DOWN
- tapOn:
    id: "prefs-account-row"
- assertVisible:
    id: "account-logout-btn"
- tapOn:
    id: "account-logout-btn"
- tapOn: "Выйти"
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000
- tapOn:
    id: "login-back-btn"
- extendedWaitUntil:
    visible:
      id: "profile-guest-login-btn"
    timeout: 10000
